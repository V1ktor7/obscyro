<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The mark, not an approximation of it. The previous icon drew two concentric
    circles; the logo is two circles of equal radius offset so they overlap, and
    at favicon size that difference is the only thing anyone can actually see.

    Scaled from the 322.55-wide artboard by 0.0837 so the rings span 2.5..29.5,
    which keeps the stroke thick enough to read at 16px without clipping.
  -->
  <rect width="32" height="32" rx="7" fill="#08090C"/>
  <g fill="none" stroke="#EDEFF2" stroke-width="3.1">
    <circle cx="13" cy="16" r="8.9"/>
    <circle cx="19" cy="16" r="8.9" stroke-opacity="0.73"/>
  </g>
</svg>
